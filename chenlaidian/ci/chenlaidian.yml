name: chenlaidian-apk

on:
  push:
    branches: [main]
    paths:
      - "chenlaidian/**"
      - ".github/workflows/chenlaidian.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: chenlaidian
        env:
          CHEN_WS_TOKEN: ${{ secrets.CHEN_WS_TOKEN }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: chenlaidian-debug
          path: chenlaidian/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
