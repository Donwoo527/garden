<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- 0929 一起读：书里带的脚本一律不跑（foliate-js README 的 CSP 要求）；资源只认自己这个源和 blob: -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self'; style-src 'self' blob: 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; connect-src 'self' blob: data:; frame-src blob: data:; object-src blob: data:; worker-src 'self' blob:; form-action 'none';">
<title>一起读</title>
<style>
:root {
    --bubble-bg: #45403A;
    --bubble-ink: #ECE8E2;
}
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #ECE8E2;
    font-family: system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
}
foliate-view {
    display: block;
    width: 100%;
    height: 100%;
}
/* 辰的话：贴在划线那句旁边的小气泡，点一下消失；这句不在当前屏上时停在底部中间 */
#bubble {
    display: none;
    position: fixed;
    z-index: 10;
    max-width: min(78vw, 360px);
    padding: 8px 12px;
    border-radius: 12px;
    background: var(--bubble-bg);
    color: var(--bubble-ink);
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
}
#bubble.docked {
    transform: translateX(-50%);
}
#bubble::before {
    content: "辰";
    display: inline-block;
    margin-right: 6px;
    padding: 0 5px;
    border-radius: 6px;
    font-size: 11px;
    background: rgba(255, 255, 255, .18);
}
</style>
</head>
<body>
<div id="bubble"></div>
<script type="module" src="reader.js"></script>
</body>
</html>
